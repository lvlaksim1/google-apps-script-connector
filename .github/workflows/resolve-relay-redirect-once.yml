name: Resolve Relay Redirect Once

on:
  push:
    branches: [main]
    paths:
      - '.resolve-relay-redirect'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Google ContentService redirect
        shell: bash
        run: |
          set -euo pipefail
          URL="$(tr -d '\r\n' < projects/relay-probe/.web-app-url)"
          PROBE="redirect-${GITHUB_RUN_ID}"
          curl --silent --show-error --max-redirs 0             --dump-header headers.txt             --output /dev/null             "$URL?probe=$PROBE" || true

          LOCATION="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' headers.txt)"
          if [ -z "$LOCATION" ]; then
            echo "::error::No Location header returned by Apps Script"
            cat headers.txt
            exit 1
          fi

          printf '%s\n' "$LOCATION" > projects/relay-probe/.redirect-url

          git config user.name "google-apps-script-connector"
          git config user.email "actions@users.noreply.github.com"
          git add projects/relay-probe/.redirect-url
          git commit -m "Record relay probe redirect URL"
          git push
