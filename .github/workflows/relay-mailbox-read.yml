name: Relay Mailbox Read

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  read:
    if: (github.event.issue.title == '[RELAY_MAILBOX_READ]' || github.event.issue.title == '[RELAY_MAILBOX_CONTROL]') && github.actor == 'lvlaksim1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse request
        id: parse
        shell: bash
        env:
          BODY: ${{ github.event.issue.body }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          NONCE="$(jq -r '.nonce // empty' <<<"$BODY")"
          if [[ ! "$NONCE" =~ ^[A-Za-z0-9._-]{1,120}$ ]]; then
            echo "::error::Invalid nonce"
            exit 2
          fi
          echo "nonce=$NONCE" >> "$GITHUB_OUTPUT"
          if [[ "$TITLE" == "[RELAY_MAILBOX_CONTROL]" ]]; then
            PAYLOAD="$(jq -c '.control_payload // empty' <<<"$BODY")"
            if [[ -z "$PAYLOAD" || "$PAYLOAD" == "null" ]]; then
              echo "::error::Missing control_payload"
              exit 2
            fi
            printf '%s' "$PAYLOAD" > /tmp/control-payload.json
            echo "control=true" >> "$GITHUB_OUTPUT"
          else
            echo "control=false" >> "$GITHUB_OUTPUT"
          fi

      - name: POST control payload
        if: steps.parse.outputs.control == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL="$(tr -d '\r\n' < projects/relay-probe/.web-app-url)"
          curl --location --fail --silent --show-error \
            -H 'Content-Type: text/plain;charset=UTF-8' \
            --data-binary @/tmp/control-payload.json \
            "$URL" >/tmp/control-response.txt
          cat /tmp/control-response.txt

      - name: Read mailbox
        shell: bash
        env:
          NONCE: ${{ steps.parse.outputs.nonce }}
        run: |
          set -euo pipefail
          URL="$(tr -d '\r\n' < projects/relay-probe/.web-app-url)"
          RESPONSE="$(curl --location --fail --silent --show-error "$URL?mode=read&nonce=$NONCE")"
          mkdir -p probes/mailbox
          printf '%s' "$RESPONSE" > "probes/mailbox/$NONCE.txt"

      - name: Persist mailbox result
        shell: bash
        env:
          NONCE: ${{ steps.parse.outputs.nonce }}
        run: |
          set -euo pipefail
          git config user.name "relay-mailbox-reader"
          git config user.email "actions@users.noreply.github.com"
          git add "probes/mailbox/$NONCE.txt"
          git commit -m "Read relay mailbox $NONCE"
          git pull --rebase
          git push

      - name: Report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          NONCE: ${{ steps.parse.outputs.nonce }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Relay mailbox read completed. Nonce: $NONCE. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
